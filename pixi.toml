[project]
name = "adp-3d"
version = "0.1.0"
description = "ADP-3D: Solving Inverse Problems in Protein Space Using Diffusion-Based Priors"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[dependencies]
python = "3.9.*"
ffmpeg = "*"
pip = "*"

[pypi-dependencies]
biopython = "==1.83"
generate-chroma = "==1.0.0"
matplotlib = "==3.8.2"
mrcfile = "==1.5.0"
numpy = "==2.1.3"
plotly = "==5.18.0"
scipy = "==1.14.1"
torch = "==2.1.2"